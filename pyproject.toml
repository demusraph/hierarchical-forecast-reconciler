[project]
name = "hierarchical-forecast-reconciler"
version = "0.1.0"
description = "Optimal MinT reconciliation and coherence alignment for multi-level time-series forecasts"
dependencies = [
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "uvicorn>=0.23.0"
]
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"